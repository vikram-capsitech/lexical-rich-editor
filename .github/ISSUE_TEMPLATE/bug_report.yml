name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "e.g. 1.0.3"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Share a code snippet or a link to a CodeSandbox / StackBlitz that reproduces the issue.
      placeholder: |
        <ContentEditorComponent
          namespace="test"
          value={value}
          onChange={setValue}
          level={ContentEditorLevel.Pro}
        />
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "React version, browser, OS"
      placeholder: |
        - React: 18.3.1
        - Browser: Chrome 124
        - OS: Windows 11
    validations:
      required: false
